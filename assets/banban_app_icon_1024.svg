<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- iOS rounded rectangle mask -->
    <rect id="ios-shape" x="0" y="0" width="1024" height="1024" rx="230" ry="230"/>

    <!-- Gradient background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9A9E"/>
      <stop offset="50%" stop-color="#FECFEF"/>
      <stop offset="100%" stop-color="#A8EDEA"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Soft shadow -->
    <filter id="soft-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background with iOS rounded rectangle -->
  <g clip-path="url(#ios-shape)">
    <rect width="1024" height="1024" fill="url(#bg-grad)"/>

    <!-- Decorative circles -->
    <circle cx="200" cy="200" r="120" fill="#FFFFFF" opacity="0.2"/>
    <circle cx="850" cy="300" r="80" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="150" cy="800" r="100" fill="#FFFFFF" opacity="0.1"/>
    <circle cx="900" cy="850" r="60" fill="#FFFFFF" opacity="0.2"/>

    <!-- Stars/sparkles -->
    <g fill="#FFD700" opacity="0.8">
      <path d="M300 180 Q305 195 320 200 Q305 205 300 220 Q295 205 280 200 Q295 195 300 180Z"/>
      <path d="M750 150 Q753 160 763 163 Q753 166 750 176 Q747 166 737 163 Q747 160 750 150Z"/>
      <path d="M180 650 Q183 660 193 663 Q183 666 180 676 Q177 666 167 663 Q177 660 180 650Z"/>
      <path d="M850 700 Q853 710 863 713 Q853 716 850 726 Q847 716 837 713 Q847 710 850 700Z"/>
    </g>
  </g>

  <!-- Main character: Cute AI companion face -->
  <g transform="translate(512, 520)" filter="url(#soft-shadow)">
    <!-- Body/head shape -->
    <ellipse cx="0" cy="-20" rx="200" ry="190" fill="#FFFFFF"/>

    <!-- Ears/antenna -->
    <ellipse cx="-160" cy="-120" rx="35" ry="50" fill="#FFFFFF" transform="rotate(-30 -160 -120)"/>
    <ellipse cx="160" cy="-120" rx="35" ry="50" fill="#FFFFFF" transform="rotate(30 160 -120)"/>
    <circle cx="-160" cy="-150" r="18" fill="#FF9A9E"/>
    <circle cx="160" cy="-150" r="18" fill="#FF9A9E"/>

    <!-- Antenna on top -->
    <line x1="0" y1="-210" x2="0" y2="-280" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="0" cy="-290" r="25" fill="#FFD700" opacity="0.9"/>
    <circle cx="0" cy="-290" r="15" fill="#FFEC8B"/>

    <!-- Eyes -->
    <g>
      <!-- Left eye -->
      <ellipse cx="-70" cy="-30" rx="45" ry="55" fill="#2C3E50"/>
      <ellipse cx="-60" cy="-50" rx="18" ry="22" fill="#FFFFFF"/>
      <circle cx="-55" cy="-45" r="8" fill="#FFFFFF"/>
      <!-- Right eye -->
      <ellipse cx="70" cy="-30" rx="45" ry="55" fill="#2C3E50"/>
      <ellipse cx="80" cy="-50" rx="18" ry="22" fill="#FFFFFF"/>
      <circle cx="85" cy="-45" r="8" fill="#FFFFFF"/>
    </g>

    <!-- Cheeks -->
    <ellipse cx="-120" cy="20" rx="30" ry="20" fill="#FF9A9E" opacity="0.5"/>
    <ellipse cx="120" cy="20" rx="30" ry="20" fill="#FF9A9E" opacity="0.5"/>

    <!-- Smile -->
    <path d="M-50 50 Q0 100 50 50" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M-45 48 Q0 90 45 48" stroke="#FF9A9E" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- Chat bubble hint -->
    <g transform="translate(140, 80)">
      <rect x="0" y="0" width="80" height="60" rx="20" fill="#A8EDEA" opacity="0.9"/>
      <polygon points="0,45 -15,60 0,55" fill="#A8EDEA" opacity="0.9"/>
      <circle cx="25" cy="30" r="6" fill="#FFFFFF"/>
      <circle cx="45" cy="30" r="6" fill="#FFFFFF"/>
      <circle cx="65" cy="30" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Heart hint -->
    <g transform="translate(-160, 90)">
      <path d="M0 10 Q-15 -5 -25 10 Q-35 25 -15 40 L0 55 L15 40 Q35 25 25 10 Q15 -5 0 10Z" fill="#FF6B6B" opacity="0.8"/>
    </g>
  </g>

  <!-- iOS icon subtle border/shine -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
</svg>